<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Vayam · View in AR</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c49a3c; --ink:#0a0a0a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--ink); color:#fff;
              font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { display:flex; align-items:baseline; gap:12px; padding:16px 20px 10px; flex-shrink:0; }
  .mark { font-family:'Playfair Display',serif; font-weight:300; font-size:20px; letter-spacing:.28em; }
  .unit { margin-left:auto; text-align:right; line-height:1.3; }
  .unit b { display:block; color:var(--gold); font-size:13px; letter-spacing:.16em; text-transform:uppercase; font-weight:500; }
  .unit span { font-size:10px; color:rgba(255,255,255,.35); letter-spacing:.08em; }

  #stage { flex:1; position:relative; min-height:0; }
  model-viewer { width:100%; height:100%; background:transparent;
                 --poster-color:transparent; --progress-bar-color:var(--gold); }

  .hint { position:absolute; left:0; right:0; bottom:10px; text-align:center;
          font-size:10px; letter-spacing:.18em; text-transform:uppercase;
          color:rgba(255,255,255,.22); pointer-events:none; }

  footer { flex-shrink:0; padding:14px 16px calc(18px + env(safe-area-inset-bottom));
           display:flex; flex-direction:column; gap:10px;
           border-top:1px solid rgba(255,255,255,.07); background:rgba(0,0,0,.5); }

  .btn { display:flex; align-items:center; gap:14px; width:100%; padding:15px 18px;
         border:1px solid rgba(255,255,255,.12); border-radius:14px; background:rgba(255,255,255,.04);
         color:#fff; font:inherit; text-align:left; text-decoration:none; cursor:pointer;
         transition:background .2s, border-color .2s; }
  .btn:active { background:rgba(255,255,255,.09); }
  .btn.primary { background:var(--gold); border-color:var(--gold); color:#000; }
  .btn .ico { font-size:22px; line-height:1; width:26px; text-align:center; flex-shrink:0; }
  .btn .txt { flex:1; min-width:0; }
  .btn .txt b { display:block; font-size:14px; font-weight:600; letter-spacing:.02em; }
  .btn .txt span { display:block; font-size:11px; opacity:.6; margin-top:2px; line-height:1.35; }
  .btn[hidden] { display:none; }
  .btn.off { opacity:.4; pointer-events:none; }

  #note { font-size:11px; line-height:1.5; color:rgba(255,255,255,.3); padding:0 4px; }
  #note b { color:rgba(255,255,255,.55); font-weight:600; }
  a { color:var(--gold); }
</style>
</head>
<body>

<header>
  <span class="mark">VAYAM</span>
  <span class="unit"><b id="uLabel">3 BHK</b><span id="uDetail">1,850 sq.ft</span></span>
</header>

<div id="stage">
  <model-viewer id="mv"
    alt="Vayam apartment 3D model"
    camera-controls touch-action="pan-y"
    interaction-prompt="none"
    shadow-intensity="0.6"
    exposure="1"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"
    camera-orbit="35deg 68deg auto" min-camera-orbit="auto 0deg auto">
  </model-viewer>
  <div class="hint">Drag to orbit · Pinch to zoom</div>
</div>

<footer>
  <a class="btn primary" id="btnCard" href="#">
    <span class="ico">🎴</span>
    <span class="txt"><b>Scan the Vayam card</b>
      <span>Hold your camera over the printed card or pamphlet</span></span>
  </a>

  <button class="btn" id="btnRoom" hidden>
    <span class="ico">📐</span>
    <span class="txt"><b>Place in your room</b>
      <span>Life-size on your own floor. Pinch to shrink to tabletop.</span></span>
  </button>

  <p id="note"></p>
</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<script type="module">
  import { UNITS, currentUnitKey } from '/ar/units.js';

  const key  = currentUnitKey();
  const unit = UNITS[key];

  document.getElementById('uLabel').textContent  = unit.label;
  document.getElementById('uDetail').textContent = unit.detail;

  const mv = document.getElementById('mv');
  mv.src    = unit.room;
  mv.poster = unit.poster;

  // Card AR lives on its own page so MindAR's ~2.6 MB tracker only downloads
  // for people who actually have the printed card in hand.
  document.getElementById('btnCard').href = `/ar/card.html?unit=${key}`;

  /* ── Surface AR is the one lane that genuinely is not universal ──
     Android needs Google Play Services for AR (ARCore), which a large share of
     budget handsets do not ship. iOS needs 12+ for AR Quick Look. We show the
     button only when the device can actually honour it, and say so otherwise. */
  const btnRoom = document.getElementById('btnRoom');
  const note    = document.getElementById('note');

  btnRoom.addEventListener('click', () => mv.activateAR());

  async function reportSupport() {
    await customElements.whenDefined('model-viewer');
    const webxr = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false));
    const quick = document.createElement('a').relList?.supports?.('ar') === true;

    if (mv.canActivateAR) {
      btnRoom.hidden = false;
      note.innerHTML = webxr
        ? '<b>Life-size AR ready.</b> Your phone supports full room placement.'
        : quick
          ? '<b>Life-size AR ready</b> via AR Quick Look.'
          : '<b>Life-size AR ready.</b>';
    } else {
      note.innerHTML =
        '<b>Life-size room placement is not available on this phone.</b> ' +
        'It needs ARCore (Android) or iOS 12+. The card scan and the 3D view above both still work.';
    }
  }

  mv.addEventListener('load', reportSupport, { once: true });
  reportSupport();

  // Surface a hard failure rather than leaving a black rectangle.
  mv.addEventListener('error', (e) => {
    note.innerHTML = `<b>Could not load the 3D model.</b> ${unit.room} — run <code>npm run models:ar</code> to generate it.`;
    console.error('[vayam-ar]', e.detail);
  });
</script>
</body>
</html>
